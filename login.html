<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Timeless Art</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <nav class="main-nav">
            <div class="nav-wrapper">
                <div class="logo-container">
                    <a href="index.html" class="logo">
                        <span class="logo-text">TIMELESS</span>
                        <span class="logo-separator"></span>
                        <span class="logo-subtext">ART</span>
                    </a>
                </div>
                
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#gallery">Gallery</a></li>
                    <li><a href="index.html#artists">Artists</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>

                <div class="nav-actions">
                    <div class="auth-dropdown">
                        <button class="auth-toggle">
                            <i class="fas fa-user-circle"></i>
                            <span>Account</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="auth-menu">
                            <a href="login.html"><i class="fas fa-sign-in-alt"></i>Login</a>
                            <a href="register.html"><i class="fas fa-user-plus"></i>Register</a>
                        </div>
                    </div>
                    <button class="search-toggle"><i class="fas fa-search"></i></button>
                    <button class="cart-toggle"><i class="fas fa-shopping-cart"></i></button>
                    <button class="mobile-menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-container">
            <h2>Login to Your Account</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
                <p class="auth-link"><a href="#">Forgot password?</a></p>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
