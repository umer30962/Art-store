<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Timeless Art</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-top">
            <div class="header-contact">
                <span><i class="fas fa-phone"></i> +92-316 107 179</span>
                <span><i class="fas fa-envelope"></i> info@timelessart.com</span>
            </div>
            <div class="header-auth">
                <a href="login.html">Login</a>
                <span class="divider">|</span>
                <a href="register.html">Register</a>
            </div>
        </div>
        <nav class="main-nav">
            <div class="nav-wrapper">
                <div class="logo-container">
                    <div class="logo">
                        <span class="logo-text">TIMELESS</span>
                        <span class="logo-separator"></span>
                        <span class="logo-subtext">ART</span>
                    </div>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#gallery">Gallery</a></li>
                    <li><a href="index.html#artists">Artists</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                    <li><a href="#" class="btn-nav btn-shop" id="shopNowButton">Shop Now</a></li>
                    <li><a href="login.html" class="btn-nav">Login</a></li>
                    <li><a href="register.html" class="btn-nav">Register</a></li>
                </ul>
                <div class="nav-actions">
                    <button class="search-toggle"><i class="fas fa-search"></i></button>
                    <button class="cart-toggle"><i class="fas fa-shopping-bag"></i></button>
                </div>
                <div class="hamburger">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
            </div>
        </nav>
        <div class="search-overlay">
            <div class="search-container">
                <input type="text" placeholder="Search for art...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <section class="auth-section">
        <div class="auth-container">
            <h2>Login to Your Account</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn">Login</button>
                <p class="auth-link">Don't have an account? <a href="register.html">Register here</a></p>
                <p class="auth-link"><a href="#">Forgot password?</a></p>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
