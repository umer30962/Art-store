<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Timeless Art</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <nav class="main-nav">
            <div class="nav-wrapper">
                <div class="logo-container">
                    <a href="index.html" class="logo">
                        <span class="logo-text">TIMELESS</span>
                        <span class="logo-separator"></span>
                        <span class="logo-subtext">ART</span>
                    </a>
                </div>
                
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#gallery">Gallery</a></li>
                    <li><a href="index.html#artists">Artists</a></li>
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>

                <div class="nav-actions">
                    <div class="auth-dropdown">
                        <button class="auth-toggle">
                            <i class="fas fa-user-circle"></i>
                            <span id="userDisplayName">Account</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                        <div class="auth-menu">
                            <a href="profile.html"><i class="fas fa-user"></i>Profile</a>
                            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i>Logout</a>
                        </div>
                    </div>
                    <button class="search-toggle"><i class="fas fa-search"></i></button>
                    <button class="cart-toggle"><i class="fas fa-shopping-cart"></i></button>
                    <button class="mobile-menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </nav>
        <div class="search-overlay">
            <div class="search-container">
                <input type="text" placeholder="Search for art...">
                <button><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <section class="profile-section">
        <div class="profile-container">
            <h2>My Profile</h2>
            <div class="profile-info">
                <div class="profile-field">
                    <span class="field-label">Name:</span>
                    <span id="profileName"></span>
                </div>
                <div class="profile-field">
                    <span class="field-label">Email:</span>
                    <span id="profileEmail"></span>
                </div>
            </div>
            
            <div class="profile-orders">
                <h3>Order History</h3>
                <div id="orderHistory">
                    <!-- Order history will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
